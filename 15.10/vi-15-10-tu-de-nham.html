<style>
  :root{--primary:#1D9E75;--primary-dark:#127c5b;--primary-light:#e8f7f2;--text:#1e293b;--muted:#94a3b8;--wrong:#dc2626;--wrong-bg:#fef2f2;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Outfit','Segoe UI',Arial,sans-serif;background:var(--primary-light);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:32px 16px 60px;}
  .hero{max-width:680px;width:100%;text-align:center;margin-bottom:14px;}
  .kicker{font-size:.78rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--primary-dark);margin-bottom:8px;}

  .byline{font-style:italic;color:var(--muted);font-size:.8rem;margin-top:8px;}
  .nav{max-width:680px;width:100%;display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .nav a{flex:1;min-width:60px;text-align:center;padding:10px 4px;border-radius:10px;text-decoration:none;font-weight:700;font-size:.82rem;border:1.5px solid var(--primary);color:var(--primary-dark);background:#fff;}
  .nav a.active{background:var(--primary);color:#fff;}
  .scorebar{max-width:680px;width:100%;background:#fff;border-radius:12px;padding:12px 16px;margin-bottom:18px;font-size:.9rem;color:var(--primary-dark);font-weight:700;text-align:center;border:1.5px solid var(--primary);}
  .card{max-width:680px;width:100%;background:#fff;border:1px solid #d7f0e6;border-radius:16px;padding:18px 20px;margin-bottom:14px;box-shadow:0 1px 3px rgba(18,124,91,0.08);}
  .qnum-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;}
  .qnum{font-weight:800;color:var(--primary-dark);font-size:.85rem;}
  .btn-submit-q{padding:5px 12px;border:1.5px solid var(--primary);border-radius:8px;font-size:.75rem;font-weight:700;cursor:pointer;background:#fff;color:var(--primary-dark);transition:.15s;white-space:nowrap;flex-shrink:0;}
  .btn-submit-q:hover{background:var(--primary);color:#fff;}
  .btn-submit-q:disabled{background:#f1f5f9;border-color:#cbd5e1;color:#94a3b8;cursor:default;}
  .qtext{font-size:1rem;line-height:1.55;margin-bottom:12px;}
  .qtext b{color:var(--primary-dark)}
  .options{display:flex;flex-direction:column;gap:8px;}
  .opt{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1.5px solid #e2e8f0;border-radius:10px;cursor:pointer;transition:.15s;font-size:.95rem;}
  .opt:hover{border-color:var(--primary);background:var(--primary-light);}
  .opt input{accent-color:var(--primary);width:16px;height:16px;flex-shrink:0;}
  .opt.correct{border-color:var(--primary);background:var(--primary-light);font-weight:700;color:var(--primary-dark);}
  .opt.wrong{border-color:var(--wrong);background:var(--wrong-bg);color:var(--wrong);}
  .result{display:none;margin-top:12px;}
  .result.show{display:block;}
  .result-box{padding:12px 14px;border-radius:8px;font-size:.85rem;line-height:1.65;margin-top:8px;background:#f8fafc;border-left:3px solid var(--primary);color:#334155;}
  .result-box b{color:var(--primary-dark);}
  .meanings-list{margin-top:4px;padding-left:2px;}
  .meanings-list div{margin-bottom:2px;}
  .actions{max-width:680px;width:100%;display:flex;gap:12px;margin:18px 0;}
  .btn{flex:1;padding:14px;border:none;border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer;transition:.15s;box-shadow:0 4px 14px rgba(0,0,0,0.12);}
  .btn-submit-all{background:var(--primary);color:#fff;}
  .btn-submit-all:hover{background:var(--primary-dark);}
  .btn-reset{background:#fff;color:var(--primary-dark);border:1.5px solid var(--primary);}
  .btn-reset:hover{background:var(--primary-light);}
  .wm-footer{margin-top:10px;font-size:.72rem;color:#b0b0b0;font-style:italic;text-align:center;}
</style>
</head>

const QUESTIONS = [{"cluster": "productive", "q": "The new software made our approval process much more ______, saving us two hours a day.", "options": ["productive", "effective", "production", "efficient"], "answer": 3, "explain": "\"efficient\" là đạt kết quả mà TỐN ÍT thời gian, công sức — khớp với việc tiết kiệm hai tiếng mỗi ngày.", "translation": "Phần mềm mới làm quy trình phê duyệt của chúng tôi hiệu suất hơn nhiều, tiết kiệm hai tiếng mỗi ngày.", "meanings": ["năng suất cao, làm ra nhiều kết quả — không diễn tả ý tiết kiệm thời gian", "hiệu quả, đạt được mục tiêu — nói về kết quả chứ không nói về việc tiết kiệm thời gian", "việc sản xuất (danh từ) — sai từ loại sau \"more\"", "hiệu suất cao, ít tốn thời gian công sức — đúng"]}, {"cluster": "productive", "q": "The medicine proved very ______; the patient recovered within a week.", "options": ["effect", "productive", "effective", "efficient"], "answer": 2, "explain": "\"effective\" là có tác dụng thật, ĐẠT ĐƯỢC mục tiêu — đúng với việc bệnh nhân khỏi bệnh.", "translation": "Loại thuốc này tỏ ra rất hiệu quả; bệnh nhân đã hồi phục trong vòng một tuần.", "meanings": ["ảnh hưởng (danh từ) — sai từ loại sau \"very\"", "năng suất cao — dùng cho người, đội nhóm, nhà máy làm ra sản phẩm", "hiệu quả, có tác dụng thật — đúng", "hiệu suất cao, ít tốn nguồn lực — thuốc thì nói về tác dụng, không nói về tiết kiệm công sức"]}, {"cluster": "productive", "q": "It was a very ______ meeting: we finished three reports and set next month's targets.", "options": ["efficient", "production", "productively", "productive"], "answer": 3, "explain": "\"productive\" là làm ra được NHIỀU KẾT QUẢ — khớp với việc xong ba báo cáo và đặt xong mục tiêu.", "translation": "Đó là một cuộc họp rất hiệu quả về mặt sản lượng: chúng tôi xong ba báo cáo và đặt xong mục tiêu tháng sau.", "meanings": ["hiệu suất cao, ít tốn nguồn lực — nhấn vào tiết kiệm chứ không phải khối lượng làm được", "việc sản xuất (danh từ) — sai từ loại trước \"meeting\"", "m ích (tính từ) — đúng", "đang giúp (V-ing) — sai từ loại", "một cách hữu ích (trạng từ) — không song song được với tính từ \"easy\"", "sự giúp đỡ (danh từ) — sai từ loại"]}, {"cluster": "ly-adj", "q": "All visitors said the hotel staff were extremely ______.", "options": ["friends", "friend", "friendlily", "friendly"], "answer": 3, "explain": "\"friendly\" tuy tận cùng -ly nhưng là TÍNH TỪ (danh từ friend + ly), dùng được sau \"were extremely\".", "translation": "Tất cả khách đều nói nhân viên khách sạn cực kỳ thân thiện.", "meanings": ["các người bạn (danh từ số nhiều) — sai từ loại", "bạn (danh từ số ít) — sai từ loại sau \"extremely\"", "không tồn tại trong tiếng Anh — \"friendly\" không có dạng trạng từ", "thân thiện (tính từ) — đúng"]}, {"cluster": "ly-adj", "q": "The technician responded ______ and fixed the problem the same morning.", "options": ["quickly", "timely", "quickness", "quick"], "answer": 0, "explain": "Sau động từ thường \"responded\" cần TRẠNG TỪ. \"timely\" tận cùng -ly nhưng lại là TÍNH TỪ nên không dùng được ở đây.", "translation": "Kỹ thuật viên đã phản hồi nhanh chóng và sửa xong vấn đề ngay trong sáng đó.", "meanings": ["một cách nhanh chóng (trạng từ) — đúng", "kịp thời (tính từ, dù tận cùng -ly) — không bổ nghĩa được cho động từ", "sự nhanh chóng (danh từ) — sai từ loại", "nhanh (tính từ) — sau động từ thường phải dùng trạng từ"]}, {"cluster": "throughout", "q": "The shop stays busy ______ the whole year, not just at the holidays.", "options": ["throughout", "among", "during", "while"], "answer": 0, "explain": "\"throughout\" nhấn mạnh SUỐT TỪ ĐẦU TỚI CUỐI khoảng thời gian — khớp với \"not just at the holidays\".", "translation": "Cửa hàng luôn đông khách suốt cả năm, chứ không chỉ vào dịp lễ.", "meanings": ["suốt từ đầu tới cuối — đúng", "trong số — dùng cho nhóm người/vật, không dùng cho thời gian", "trong khoảng (một thời điểm nào đó trong khoảng) — không nhấn mạnh được ý \"cả năm\" ở đây", "trong khi — là liên từ, cần cả mệnh đề S + V nswer": 1, "explain": "\"increment\" là mức tăng theo TỪNG ĐỢT, từng nấc đều đặn — đúng với việc tăng lương mỗi tháng Một.", "translation": "Nhân viên được tăng lương ba phần trăm vào mỗi tháng Một.", "meanings": ["sự cắt giảm — ngược hẳn nghĩa", "mức tăng theo từng đợt, từng nấc — đúng", "sự tăng lên — thừa \"of\" vì câu đã có \"of\" ngay sau chỗ trống", "mang tính tăng dần (tính từ) — sai từ loại sau \"a salary\""]}, {"cluster": "increase", "q": "The company announced a significant ______ in operating costs this quarter.", "options": ["increment", "reduce", "reductive", "reduction"], "answer": 3, "explain": "Sau \"a significant\" cần một DANH TỪ, và \"reduction\" nghĩa là sự cắt giảm.", "translation": "Công ty đã công bố mức cắt giảm đáng kể chi phí vận hành trong quý này.", "meanings": ["mức tăng theo đợt — nói về tăng, không phải giảm, và thường dùng cho lương", "giảm (động từ) — sai từ loại sau \"a significant\"", "mang tính giản lược (tính từ) — sai từ loại và sai nghĩa", "sự cắt giảm (danh từ) — đúng"]}, {"cluster": "pleased", "q": "We are very ______ to announce the opening of our second branch.", "options": ["pleased", "pleasing", "pleasure", "please"], "answer": 0, "explain": "\"be pleased to + V\" là cụm cố định nghĩa là rất vui mừng được làm gì — sau \"are very\" cần tính từ.", "translation": "Chúng tôi rất vui mừng được thông báo việc khai trương chi nhánh thứ hai.", "meanings": ["hài lòng, vui mừng (tính từ) — đúng", "dễ chịu, làm vừa lòng (tính từ) — tả sự vật gây cảm giác, không tả người đang vui mừng", "niềm vinh hạnh (danh từ) — phải là \"It is a pleasure to…\"", "làm hài lòng (động từ) — sai từ loại sau \"are very\""]}, {"cluster": "pleased", "q": "It is a great ______ to work with such a dedicated team.", "options": ["please", "pleasure", "pleased", "pleasant"], "answer": 1, "explain": "Sau \"a great\" cần một DANH TỪ, và \"pleasure\" nghĩa là niềm vinh hạnh, niềm vui.", "translation": "Thật là một niềm vinh hạnh khi được làm việc với một đội ngũ uyên mẫu"]}, {"cluster": "forward", "q": "The manager was ______ to approve the budget until he saw the full figures.", "options": ["reluct", "reluctantly", "reluctant", "reluctance"], "answer": 2, "explain": "\"be reluctant to + V\" là cụm cố định nghĩa là ngần ngại làm gì — sau \"was\" cần tính từ.", "translation": "Vị quản lý đã ngần ngại phê duyệt ngân sách cho tới khi ông ấy xem đủ các con số.", "meanings": ["không phải một từ thông dụng trong tiếng Anh", "một cách miễn cưỡng (trạng từ) — không tạo thành cụm \"be … to + V\"", "ngần ngại, miễn cưỡng (tính từ) — đúng", "sự ngần ngại (danh từ) — sai từ loại sau \"was\""]}, {"cluster": "among", "q": "______ the thirty applicants, only five had the required credentials.", "options": ["Toward", "Between", "During", "Among"], "answer": 3, "explain": "\"among\" dùng cho nhóm từ BA người/vật trở lên. \"between\" chỉ dùng cho hai.", "translation": "Trong số ba mươi ứng viên, chỉ năm người có đủ bằng cấp yêu cầu.", "meanings": ["về phía — chỉ hướng di chuyển, không chỉ nhóm", "giữa (chỉ dùng cho hai đối tượng) — ở đây có tới ba mươi ứng viên", "trong khoảng thời gian — không dùng cho một nhóm người", "trong số (từ ba trở lên) — đúng"]}, {"cluster": "among", "q": "The customer leaned ______ the counter to read the small print.", "options": ["throughout", "toward", "among", "between"], "answer": 1, "explain": "\"lean toward + N\" là nghiêng người về phía cái gì — \"toward\" chỉ HƯỚNG.", "translation": "Vị khách nghiêng người về phía quầy để đọc dòng chữ nhỏ.", "meanings": ["suốt — dùng cho thời gian hoặc phạm vi, không chỉ hướng", "về phía (chỉ hướng) — đúng", "trong số — dùng cho một nhóm, không chỉ hướng", "giữa hai thứ — câu chỉ có một cái quầy"]}, {"cluster": "provided", "q": "You may use the gym free of charge ______ you show your membership card.", "options": ["provided that", "in order to", "considering that", "throughout"], "answer": 0, "explain": "\"provided that\" (= as long as) nêu ĐIỀU KIỆN để được hưởng điều vừa nói.", "translation": "Bạn có thể dùng phòng gym miễn phí miễn là bạn xuất trình thẻ thành viên.", "meanings": ["miễn là, với điều kiện là — nêu điều kiện — đúng", "để mà — chỉ mục đích và phải đi với động từ nguyên mẫu", "xét rằng — nêu bối cảnh để đánh giá, không nêu điều kiện", "suốt — là giới từ chỉ thời gian, không nối được mệnh đề"]}, {"cluster": "provided", "q": "______ the budget was so small, the result was remarkable.", "options": ["Provided that", "Following", "Throughout", "Considering that"], "answer": 3, "explain": "\"considering that\" nghĩa là xét rằng, xét về việc — nêu bối cảnh để người nghe đánh giá kết quả.", "translation": "Xét rằng ngân sách quá nhỏ, kết quả như vậy là đáng nể.", "meanings": ["miễn là — nêu điều kiện, không hợp vì ngân sách nhỏ là sự thật đã rồi", "sau khi — là giới từ, cần danh từ chứ không phải mệnh đề", "suốt — là giới từ, không nối được mệnh đề S + V", "xét rằng, xét về việc — đúng"]}, {"cluster": "credentials", "q": "Designers are asked to submit a ______ showing the projects they have completed.", "options": ["testimonial", "credential", "portfolio", "registration"], "answer": 2, "explain": "\"portfolio\" là tập hồ sơ năng lực trưng ra các sản phẩm, dự án đã làm.", "translation": "Các nhà thiết kế được yêu cầu nộp hồ sơ năng lực thể hiện những dự án họ đã hoàn thành.", "meanings": ["lời chứng thực của khách hàng cũ — là nhận xét, không phải tập dự án", "bằng cấp, giấy tờ chứng minh (thường dùng số nhiều) — không phải tập sản phẩm", "hồ sơ năng lực, tập sản phẩm đã làm — đúng", "việc đăng ký — sai nghĩa hoàn toàn"]}, {"cluster": "credentials", "q": "The website features several ______ from satisfied customers.", "options": ["credentials", "references of", "testimonials", "portfolios"], "answer": 2, "explain": "\"testimonial\" là lời chứng thực, nhận xét tích cực của khách hàng cũ — đúng với \"from satisfied customers\".", "translation": "Trang web có đăng vài lời chứng thực từ những khách hàng hài lòng.", "meanings": ["bằng cấp, giấy tờ chứng minh tư cách — khách hàng không cung cấp bằng cấp", "sai cấu trúc — thừa giới từ \"of\" trước \"from\"", "các lời chứng thực của khách hàng — đúng", "các hồ sơ năng lực — là tập dự án của người làm nghề, không phải nhận xét của khách"]}];
const QSTART = 1;
let submittedCount = 0;
let correctCount = 0;
const doneFlags = new Array(QUESTIONS.length).fill(false);

function renderQuiz(){
  submittedCount = 0;
  correctCount = 0;
  doneFlags.fill(false);
  updateScorebar();
  const container = document.getElementById('quiz');
  container.innerHTML = '';
  QUESTIONS.forEach((item, qi) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="qnum-row">
        <div class="qnum">Câu ${qi+QSTART}</div>
        <button class="btn-submit-q" id="submit-${qi}" onclick="submitOne(${qi})">Nộp</button>
      </div>
      <div class="qtext">${item.q}</div>
      <div class="options" id="opts-${qi}">
        ${item.options.map((opt, oi) => `
          <label class="opt" id="opt-${qi}-${oi}">
            <input type="radio" name="q${qi}" value="${oi}">
            <span>${String.fromCharCode(65+oi)}. ${opt}</span>
          </label>
        `).join('')}
      </div>
      <div class="result" id="result-${qi}">
        <div class="result-box"><b>Dịch câu:</b> ${item.translation}</div>
        <div class="result-box"><b>Giải thích:</b> ${item.explain}</div>
        <div class="result-box"><b>Nghĩa từng từ:</b>
          <div class="meanings-list">
            ${item.options.map((opt, oi) => `<div>${String.fromCharCode(65+oi)}. <b>${opt}</b> — ${item.meanings[oi]}</div>`).join('')}
          </div>
        </div>
      </div>
    `;
    container.appendChild(card);
  });
}

function gradeOne(qi, silent){
  if (doneFlags[qi]) return;
  const item = QUESTIONS[qi];
  const selected = document.querySelector(`input[name="q${qi}"]:checked`);
  const selVal = selected ? parseInt(selected.value) : -1;
  if (selVal === -1) {
    if (!silent) alert('Vui lòng chọn một đáp án trước khi nộp.');
    return false;
  }
  item.options.forEach((opt, oi) => {
    const optEl = document.getElementById(`opt-${qi}-${oi}`);
    optEl.querySelector('input').disabled = true;
    if (oi === item.answer) optEl.classList.add('correct');
    else if (oi === selVal) optEl.classList.add('wrong');
  });
  document.getElementById(`submit-${qi}`).disabled = true;
  document.getElementById(`submit-${qi}`).textContent = selVal === item.answer ? '✓' : '✗';
  document.getElementById(`result-${qi}`).classList.add('show');
  doneFlags[qi] = true;
  submittedCount++;
  if (selVal === item.answer) correctCount++;
  return true;
}

function submitOne(qi){ gradeOne(qi, false); updateScorebar(); }

function submitAll(){
  for (let qi = 0; qi < QUESTIONS.length; qi++) gradeOne(qi, true);
  updateScorebar();
  document.getElementById('scorebar').scrollIntoView({behavior:'smooth'});
}

function updateScorebar(){
  document.getElementById('scorebar').textContent = `Đã nộp: ${submittedCount}/${QUESTIONS.length} — Đúng: ${correctCount}`;
}

function resetQuiz(){ renderQuiz(); window.scrollTo({top:0, behavior:'smooth'}); }

renderQuiz();
</script>
